on: push
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        submodules: true
        token: ${{ secrets.PHOTOS_TOKEN }}
        persist-credentials: false

    # Shrinks photos/ to display size and strips metadata (including GPS)
    # so full-size originals never reach the server. Files keep their names.
    - name: 🖼️ Resize photos
      run: |
        command -v mogrify >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
        find photos -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -print0 \
          | xargs -0 -r mogrify -auto-orient -resize '2000x2000>' -strip -quality 82

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_URL }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.vscode/**
          **/.well-known*/**
          **/blog*/**
          **/vendor*/**
          **/php.ini
          photos/README.md
